# Dependabot opens pull requests when dependencies have updates or security fixes.
# Each PR runs through the CI workflow, so an update only merges if the tests pass.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Major upgrades (like TypeScript 7, Zod 4 or Konva 10) can break things,
    # so they're planned and tested by hand instead of opened automatically.
    # Security fixes still arrive through Dependabot security updates.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
